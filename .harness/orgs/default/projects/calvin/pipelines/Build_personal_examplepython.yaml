pipeline:
  name: Build personal example-python
  identifier: Build_personal_examplepython
  tags: {}
  projectIdentifier: calvin
  orgIdentifier: default
  properties:
    ci:
      codebase:
        connectorRef: Personal_GH_Connector
        build: <+input>
  stages:
    - stage:
        name: Build
        identifier: Build
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          buildIntelligence:
            enabled: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Install dependencies
                  identifier: Install_dependencies
                  spec:
                    shell: Sh
                    command: |-
                      python -m pip install --upgrade pip
                      pip install -r requirements.txt
                      pip install codecov-cli
              - step:
                  type: Run
                  name: Run tests and collect coverage
                  identifier: Run_tests_and_collect_coverage
                  spec:
                    shell: Sh
                    command: pytest --cov app --cov-report=lcov:lcov.info
              - step:
                  type: Run
                  name: Upload coverage to Harness
                  identifier: Upload_coverage_to_Harness
                  spec:
                    shell: Sh
                    command: hcli cov upload --file=lcov.info
                    envVariables:
                      CI_ENABLE_HCLI_FOR_TESTS: "true"
              - step:
                  type: Run
                  name: Upload coverage to Codecov -- arg token
                  identifier: Upload_coverage_to_Codecov_arg_token
                  spec:
                    shell: Sh
                    command: codecovcli --verbose do-upload -t "$CODECOV_TOKEN" --fail-on-error
                    envVariables:
                      CODECOV_TOKEN: <+secrets.getValue("Codecov_Upload_Token")>
